<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 1380 500"><title id="title">Three Azure Monitor collection approaches</title><desc id="desc">Three compact rows converge on a common cloud ingestion endpoint inside Azure Monitor. Azure automatically collects platform telemetry. An instrumented application or client uses SDKs or client APIs to send directly. In collector-based collection, an agent runs inside the source and sends to a shared pipeline outside the source, which forwards data to the endpoint.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#000" d="M0 0 L10 5 L0 10 Z"/></marker></defs><rect width="1380" height="500" fill="#fff"/><g fill="#000" font-family="Segoe UI, Arial, sans-serif"><text x="30" y="36" font-size="24" font-weight="600">Who moves the telemetry to Azure Monitor?</text><rect width="990" height="125" x="30" y="55" fill="#f7f7f7" stroke="#d2d2d2" stroke-width="1.5" rx="8"/><rect width="990" height="125" x="30" y="190" fill="#f7f7f7" stroke="#d2d2d2" stroke-width="1.5" rx="8"/><rect width="990" height="145" x="30" y="325" fill="#f7f7f7" stroke="#d2d2d2" stroke-width="1.5" rx="8"/><rect width="300" height="415" x="1050" y="55" fill="#fff" stroke="#0078d4" stroke-width="2" rx="8"/><rect width="275" height="30" x="387.5" y="69" fill="#eef8ed" stroke="#107c10" stroke-width="1.5" rx="15"/><rect width="275" height="30" x="387.5" y="204" fill="#eef8ed" stroke="#107c10" stroke-width="1.5" rx="15"/><rect width="275" height="30" x="387.5" y="339" fill="#eef8ed" stroke="#107c10" stroke-width="1.5" rx="15"/><rect width="420" height="50" x="55" y="112" fill="#fff" stroke="#a6a6a6" stroke-width="1.5" rx="5"/><rect width="420" height="60" x="55" y="242" fill="#fff" stroke="#a6a6a6" stroke-width="1.5" rx="5"/><rect width="175" height="44" x="280" y="250" fill="#eaf4fc" stroke="#0078d4" stroke-width="1.5" rx="5"/><rect width="420" height="69" x="55" y="383" fill="#fff" stroke="#a6a6a6" stroke-width="1.5" rx="5"/><rect width="175" height="53" x="280" y="391" fill="#eaf4fc" stroke="#0078d4" stroke-width="1.5" rx="5"/><rect width="320" height="55" x="555" y="397" fill="#eaf4fc" stroke="#0078d4" stroke-width="1.5" rx="5"/><rect width="150" height="130" x="1080" y="205" fill="#eaf4fc" stroke="#0078d4" stroke-width="1.5" rx="6"/><polyline fill="none" stroke="#000" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow)" points="475 137 990 137 990 225 1080 225"/><polyline fill="none" stroke="#000" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow)" points="475 272 1025 272 1025 255 1080 255"/><line x1="455" x2="555" y1="417" y2="417" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/><polyline fill="none" stroke="#000" stroke-linejoin="round" stroke-width="2" marker-end="url(#arrow)" points="875 425 1000 425 1000 315 1080 315"/><line x1="1230" x2="1260" y1="270" y2="270" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/><text x="525" y="91" font-size="16" font-weight="600" text-anchor="middle">Platform-native collection</text><text x="525" y="226" font-size="16" font-weight="600" text-anchor="middle">Direct collection</text><text x="525" y="361" font-size="16" font-weight="600" text-anchor="middle">Collector-based collection</text><text x="265" y="133" font-size="17" font-weight="600" text-anchor="middle">Azure resource</text><text x="265" y="153" font-size="14" text-anchor="middle">Platform logs + metrics</text><text x="780" y="126" font-size="16" font-weight="600" text-anchor="middle">Automatically collects</text><text x="165" y="278" font-size="16" font-weight="600" text-anchor="middle">Instrumented app / client</text><text x="367.5" y="278" font-size="15" font-weight="600" text-anchor="middle">SDKs / client APIs</text><text x="800" y="260" font-size="14" font-weight="600" text-anchor="middle">Direct • no separate collector</text><text x="165" y="407" font-size="16" font-weight="600" text-anchor="middle">Instrumented apps +</text><text x="165" y="429" font-size="16" font-weight="600" text-anchor="middle">telemetry producers</text><text x="367.5" y="413" font-size="16" font-weight="600" text-anchor="middle">Agent</text><text x="367.5" y="434" font-size="13" text-anchor="middle">On source</text><text x="715" y="420" font-size="17" font-weight="600" text-anchor="middle">Pipeline</text><text x="715" y="441" font-size="13" text-anchor="middle">Shared and off source</text><text x="1155" y="250" font-size="17" font-weight="600" text-anchor="middle">Cloud ingestion</text><text x="1155" y="274" font-size="17" font-weight="600" text-anchor="middle">endpoint</text><text x="1155" y="305" font-size="13" text-anchor="middle">Common entry point</text><text x="1300" y="263" font-size="20" font-weight="600" text-anchor="middle">Azure</text><text x="1300" y="287" font-size="20" font-weight="600" text-anchor="middle">Monitor</text></g></svg>