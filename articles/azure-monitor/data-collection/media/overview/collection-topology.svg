<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" aria-labelledby="title desc" role="img" viewBox="0 0 1680 1180"><title id="title">Azure Monitor data collection topology by deployment scope</title><desc id="desc">Collection choices are organized by deployment scope and progressive operational value. Direct SDK or API ingestion provides source-level retry and export with no collector. Azure Monitor agent is nested inside individual hosts and adds guest OS and workload collection, filtering, buffering, and cost control. A containerized Azure Monitor agent also supports Kubernetes infrastructure collection for Container insights and Azure Monitor managed service for Prometheus. This is distinct from platform logs and metrics generated by Azure resources. Multiple agents and other supported producers fan into an off-box Azure Monitor pipeline, which adds processing, persistent buffering, and cost control. All current paths converge on Azure Monitor cloud ingestion, optional ingest-time transformations, and storage. Microsoft Sentinel uses a Sentinel-enabled Log Analytics workspace. Mirror Azure Monitor exposes the stored data to Microsoft Fabric without copying it. DCR configuration is separate from telemetry.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#000" d="M0 0 L10 5 L0 10 Z"/></marker><marker id="blue-arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#0078d4" d="M0 0 L10 5 L0 10 Z"/></marker></defs><rect width="1680" height="1180" fill="#fff"/><g font-family="Segoe UI, Arial, sans-serif"><rect width="1640" height="140" x="18" y="20" fill="transparent" stroke="#0078d4" stroke-width="1.5" rx="5"/><text x="40" y="53" fill="#000" font-size="23" font-weight="600" text-anchor="start">Common Azure control plane</text><text x="40" y="91" fill="#000" font-size="21" font-weight="600" text-anchor="start">Data collection 